# Rate limiting zones
# Note: If these zones are defined in a shared include for multi-vhost deployments,
# do not duplicate these lines in site-specific files.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=assets:10m rate=150r/s;
# uploads: same rate as api; applied only by the optional streaming location
# below. Unused until that location is uncommented (10m shared memory,
# otherwise inert). See that block for why burst is 50 and which knob to turn.
limit_req_zone $binary_remote_addr zone=uploads:10m rate=10r/s;

# Upstream backend
upstream %UPSTREAM_NAME% {
    server 127.0.0.1:%PORT% max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name %DOMAIN_NAME% www.%DOMAIN_NAME%;

    # Security headers even for redirects
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name %DOMAIN_NAME% www.%DOMAIN_NAME%;

    # SSL Configuration
    ssl_certificate %SSL_CERT_PATH%;
    ssl_certificate_key %SSL_KEY_PATH%;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Basic settings
    # Outer gate only — Express still defaults to 10mb per route. 27M is enough
    # for bodyLimit: '25mb' (the comfortable max) plus a little headroom so nginx
    # is not the one that 413s first. Raise this if a route goes above 25mb.
    client_max_body_size 27M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # WebSocket endpoints (no rate limiting)
    location /api/1/ws/ {
        proxy_pass http://%UPSTREAM_NAME%;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;

        # Long timeouts for WebSocket connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;      # 1 hour
        proxy_read_timeout 3600s;      # 1 hour

        # No rate limiting for WebSocket connections
    }

    # Streaming uploads and downloads — DISABLED by default.
    # Uncomment this location when a route uses bodyMode: 'stream' or
    # CommonUtils.sendStream. The uploads zone is already defined above.
    #
    # 1. Uncomment the location block (leave the uploads zone as-is).
    # 2. Change /api/1/your-upload-prefix/ to your stream-route prefix —
    #    it must be a longer prefix than /api/, or /api/ still wins
    #    (buffering on, burst 20, 30s timeouts). The ^~ modifier stops a
    #    later regex location from pulling the path back onto /api/.
    # 3. Set this location's client_max_body_size to your largest bodyLimit
    #    plus a couple of MB so nginx is not the one that 413s first.
    # 4. sudo nginx -t && sudo systemctl reload nginx
    #
    # Already-deployed sites: npx jpulse configure does not rewrite this
    # file. Paste the uploads zone line (if missing) and this location
    # from the current scaffold into the live nginx config.
    #
    # A download-only path can copy the same block — request-buffering off
    # and a raised body size are harmless on GET.
    #
    # Why these directives:
    # - proxy_request_buffering off — nginx defaults to ON, so it buffers
    #   the whole body before Node sees a byte. That silently defeats
    #   bodyMode: 'stream' and reimposes client_max_body_size as a hard
    #   ceiling.
    # - proxy_buffering off — same for the response; a GridFS/S3 first
    #   byte can exceed /api/'s proxy_read_timeout 30s if nginx waits to
    #   fill a buffer.
    # - uploads zone — isolation, not part-count. Uploads otherwise share
    #   the /api/ per-IP bucket (10 r/s, burst 20) with the page's status
    #   polls and saves; one large upload degrades the rest of the session,
    #   and a NAT'd office with several uploaders is a realistic 429.
    #   Same rate as api so a flood is still bounded; burst 50 absorbs
    #   clumps from parallel parts and retries.
    #   Sustained throughput per IP is rate × part size: 10 r/s × 8 MB =
    #   80 MB/s (above any real uplink); 10 r/s × 1 MB = 10 MB/s and
    #   throttles a gigabit client. Raise rate for small parts; raise
    #   burst only for clumps.
    # - Timeouts — /api/ is 30s; too tight for a slow upload or a slow
    #   first byte. client_body_timeout 60s (server-level) is an
    #   inter-read timeout and does not need a raise here.
    #
    # Buffering-off caveats:
    # - An nginx 413 arrives mid-stream, after the app has already
    #   received and possibly written bytes. Rely on the route's
    #   bodyLimit as the cap, and unlink a partial dest the same way
    #   StreamBody.pipe's 413 path already requires.
    # - nginx cannot retry a non-buffered request against another
    #   upstream. Moot for this single-server scaffold; a trap if the
    #   site later adds upstreams.
    #
    # location ^~ /api/1/your-upload-prefix/ {
    #     limit_req zone=uploads burst=50 nodelay;
    #     limit_req_status 429;
    #
    #     client_max_body_size 100M;
    #
    #     proxy_pass http://%UPSTREAM_NAME%;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #
    #     proxy_request_buffering off;
    #     proxy_buffering off;
    #
    #     proxy_connect_timeout 30s;
    #     proxy_send_timeout 300s;
    #     proxy_read_timeout 300s;
    # }

    # API endpoints with rate limiting
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://%UPSTREAM_NAME%;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Authentication endpoints with stricter rate limiting
    # Matches the auth view pages (/auth/login.shtml, /auth/signup.shtml, /auth/logout.shtml,
    # etc.) AND the actual credential-submission API calls the browser JS makes
    # (/api/1/auth/login, /api/1/user/signup). Framework pages are never served under a top-level
    # /login/ or /signup/ path (only /auth/*), so those two alternatives previously in this regex
    # never matched anything real - removed. Without the /api/1/... alternatives, those POSTs
    # would fall through to the much looser /api/ zone above (10r/s vs 5r/m here), silently
    # defeating the intent of this stricter zone.
    # W-205: /api/1/auth/status and /api/1/auth/pending-status are deliberately NOT listed here
    # (neither is an exact /api/1/auth/login$ match, and neither starts with /auth/) - both are
    # unauthenticated status/polling reads that guess no secret, so they fall through to the
    # looser /api/ zone on purpose, keeping this zone's stricter budget reserved for actual
    # credential/step submissions.
    location ~ ^(/auth/|/api/1/auth/login$|/api/1/user/signup$) {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://%UPSTREAM_NAME%;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Assets (higher rate limit)
    location ^~ /assets/ {
        limit_req zone=assets burst=200 nodelay;
        limit_req_status 429;

        # Note: Do not use proxy_pass http://%UPSTREAM_NAME%/; with a trailing slash.
        # Doing so strips the /assets/ prefix, causing the app to receive paths like
        # /math/math.js instead of /assets/math/math.js, resulting in 404s and MIME type errors.
        proxy_pass http://%UPSTREAM_NAME%;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # All other requests to Node.js application
    location / {
        limit_req zone=general burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://%UPSTREAM_NAME%;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Security: Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(conf|log|sql|bak|backup)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# EOF deploy/nginx.prod.conf
