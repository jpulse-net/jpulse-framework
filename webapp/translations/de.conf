Wenn Sie diese Änderung vorgenommen oder erwartet haben, ist keine Aktion erforderlich.

Falls Sie dies NICHT erwartet haben, wenden Sie sich bitte umgehend an Ihren Administrator.`,
        // W-206: Passwort zurücksetzen. Der Link führt auf eine Seite, nicht auf eine
        // API-Route, damit ein E-Mail-Scanner den einmalig gültigen Token nicht verbraucht.
        passwordReset: `Subject: Passwort zurücksetzen

Hallo {{firstName}},

es wurde angefragt, das Passwort für Ihr Konto bei {{siteName}} zurückzusetzen. Falls
Sie das waren, öffnen Sie diesen Link innerhalb der nächsten Stunde:

{{resetUrl}}

Falls Sie das nicht waren, können Sie diese Nachricht ignorieren - Ihr Passwort wurde
nicht geändert.`,
        passwordResetSso: `Subject: Zu Ihrer Anfrage zum Zurücksetzen des Passworts

Hallo {{firstName}},

es wurde angefragt, das Passwort für Ihr Konto bei {{siteName}} zurückzusetzen. Ihr
Konto verwendet jedoch kein Passwort - Sie melden sich über den Anmeldedienst Ihrer
Organisation an.

Öffnen Sie einfach die Anmeldeseite und wählen Sie Ihren Anbieter:

{{loginUrl}}

Falls die Anmeldung dort nicht funktioniert, wenden Sie sich bitte an Ihren Administrator.`,
