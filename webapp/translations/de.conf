{{verifyUrl}}

Oder geben Sie diesen Code ein: {{code}}

Falls Sie dieses Konto nicht erstellt haben, können Sie diese Nachricht ignorieren.`,
        emailChangedNotice: `Subject: Ihre E-Mail-Adresse wurde geändert

Hallo {{firstName}},

die E-Mail-Adresse Ihres Kontos wurde soeben von einem Administrator auf diese Adresse geändert.

Sie werden bei Ihrer nächsten Anmeldung gebeten, sie zu bestätigen - im Moment ist keine Aktion erforderlich.

Falls Sie diese Änderung nicht erwartet haben, wenden Sie sich bitte an Ihren Administrator.`,
        emailChangedAlert: `Subject: Sicherheitshinweis: Die E-Mail-Adresse Ihres Kontos wurde geändert

Hallo {{firstName}},

