    model: {
      user: {
        // Each key is a whole email message, unix-mail style: one or more "Name: value" header
        // lines (Subject/To/Cc/Bcc/Reply-To/From - see EmailController.ALLOWED_EMAIL_HEADERS;
        // only Subject: is required, the rest are optional defaults), a blank line, then the
        // plain-text body - all as one backtick literal so the entire email is a single,
        // self-contained, eventually-overridable unit (EmailController.sendEmailFromTranslation()
        // parses this and applies {{token}} substitution from context).
        // Flush-left continuation lines to avoid indentation in the email body.
        emailVerify: `Subject: Confirm your email address

Hi {{firstName}},

Please confirm your email address by opening this link:

{{verifyUrl}}

Or enter this code: {{code}}

If you didn't create this account, you can ignore this message.`,
        emailChangedNotice: `Subject: Your email address was updated

Hi {{firstName}},

Your account's email address was just changed by an administrator to this address.

You'll be asked to verify it the next time you sign in - no action is needed right now.

If you weren't expecting this change, please contact your administrator.`,
        emailChangedAlert: `Subject: Security alert: your account email was changed

Hi {{firstName}},

Your account's email address was just changed by an administrator to {{maskedNewEmail}}.

If you made or expected this change, no action is needed.

If you did NOT expect this, please contact your administrator right away.`,
        // W-206: password reset. The link points at a page, not an API route, so a mail
        // scanner prefetching it cannot consume the single-use token.
        passwordReset: `Subject: Reset your password

Hi {{firstName}},

Someone asked to reset the password for your {{siteName}} account. If it was you, open
this link within the next hour:

{{resetUrl}}

If it wasn't you, you can ignore this message - your password has not changed.`,
        passwordResetSso: `Subject: About your password reset request

Hi {{firstName}},

Someone asked to reset the password for your {{siteName}} account, but your account
doesn't sign in with a password - you sign in through your organization's sign-in
provider instead.

Just go to the sign-in page and choose your provider:

{{loginUrl}}

If you can't sign in there, please contact your administrator.`,
        passwordChanged: `Subject: Your password was changed

Hi {{firstName}},

The password for your {{siteName}} account was just changed.

If you made this change, no action is needed.

If you did NOT make this change, please reset your password again right away and
contact your administrator - someone else may have access to your email.`,
      },
